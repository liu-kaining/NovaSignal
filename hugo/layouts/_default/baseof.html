<!DOCTYPE html>
<html lang="{{ or site.Language.Lang "zh-CN" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.Params.description }}">
  <title>
    {{- block "title" . -}}
      {{- with .Title }}{{ . }} · {{ end }}{{ site.Title -}}
    {{- end -}}
  </title>
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
</head>
<body>
  <div class="wrap">
    {{- block "main" . }}{{ end -}}
    <footer class="site-footer">内容由 AI 生成，仅供研究参考，不构成投资建议。本站由 <a href="https://gohugo.io/">Hugo</a> 静态生成。</footer>
  </div>
</body>
</html>
