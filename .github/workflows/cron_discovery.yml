name: Discovery Pipeline
# NOTE: This workflow runs discovery for monitoring/notification only.
# The main analysis pipeline (cron_agent_runner.yml) performs its own discovery
# with idempotency checks against R2 to avoid duplicate processing.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall src

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Run discovery pipeline
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python -m src.orchestrator.run_pipeline \
            --mode discovery-only \
            --lookback-days 7

      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}
          path: discovery_output.json
          retention-days: 7
        if: always()
