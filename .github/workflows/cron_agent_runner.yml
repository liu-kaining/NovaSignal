name: Agent Runner Pipeline

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated symbols to analyze (leave empty for auto-discovery)"
        required: false
        type: string
      mode:
        description: "Pipeline mode"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - dev
  schedule:
    - cron: "30 8 * * 1-5"

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Run agent pipeline
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          SYMBOLS_ARG=""
          if [ -n "${{ inputs.symbols }}" ]; then
            SYMBOLS_ARG="--symbols ${{ inputs.symbols }}"
          fi

          python -m src.orchestrator.run_pipeline \
            --mode ${{ inputs.mode || 'production' }} \
            --concurrency 4 \
            --timeout 300 \
            $SYMBOLS_ARG

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-${{ github.run_id }}
          path: |
            *.log
          retention-days: 14
        if: always()
