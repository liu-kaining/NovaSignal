project:
  name: NovaSignal
  domain: novasignal.thetamind.ai

fmp:
  base_url: https://financialmodelingprep.com/stable
  timeout_seconds: 30
  retry:
    attempts: 6
    min_wait_seconds: 5
    max_wait_seconds: 120

r2:
  endpoint_url: ${R2_ENDPOINT_URL}
  access_key_id: ${R2_ACCESS_KEY_ID}
  secret_access_key: ${R2_SECRET_ACCESS_KEY}
  bucket_name: novasignal
  retry:
    attempts: 3
    min_wait_seconds: 1
    max_wait_seconds: 8

pipeline:
  # Quality > quantity. Each symbol can take 15–30 min through the full 3-stage
  # flow (Drafter heaviest: 8+ web searches, optional Task subagents, ~3500 word
  # bilingual report, self-check). 3 high-quality reports per cron beats 20 mediocre.
  model: ""          # empty = CLI default; opus-4-x strongly recommended for production quality
  base_url: ""       # empty = official Anthropic API
  sandbox_timeout_seconds: 900   # per-stage default; overridden by stages.* below
  concurrency: 1     # sequential by default — 3-stage flow is too heavy for parallelism
  max_symbols_per_run: 3
  modes:
    - discovery-only
    - production
    - dev
  agent_command: "claude --print --dangerously-skip-permissions"

  # Per-stage timeouts and retry budgets for the Drafter → Reviewer → Reviser flow.
  # Budgets sized for opus-class models doing real Web research.
  stages:
    drafter_timeout_seconds: 900     # Stage A: 15 min ceiling (research + draft)
    reviewer_timeout_seconds: 480    # Stage B: 8 min ceiling (critique)
    reviser_timeout_seconds: 600     # Stage C: 10 min ceiling (surgical edits)
    drafter_max_attempts: 2          # 1 normal + up to 1 QA-feedback retry
    reviser_max_attempts: 2
    url_verify_sample: 5             # HEAD-check sample size from report URLs
    url_verify_timeout: 5
    skip_url_verification: false     # set true in dev to avoid network hits

  # QA gate thresholds (advisory — actual thresholds live in quality_gate.py)
  # Documented here so operators can quickly see the current contract.
  quality_gate_notes:
    draft_min_urls: 6
    final_min_urls: 8
    draft_max_unknown_phrases: 8
    final_max_unknown_phrases: 5
    required_chapters: 8
    draft_max_null_metric_fields: 5
    final_max_null_metric_fields: 3

evolution:
  deviation_threshold: 0.15
  min_samples_for_correction: 5
  lookback_days: 30
  auto_correct: true
